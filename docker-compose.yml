version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: deppi-extension
    restart: always
    environment:
      POSTGRES_USER: deppi-extension-user
      POSTGRES_PASSWORD: deppi-extension-passoword
      POSTGRES_DB: deppi-extension-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
